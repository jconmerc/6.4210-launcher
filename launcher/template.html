<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6.4210 Robotic Manipulation — Launcher</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e3df;
    --accent:#A31F34; --accent-soft:#fdeef0; --chip:#f0f1f3; --chip-ink:#26282e;
    --lect:#2c5aa0; --lect-soft:#eef3fb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#141518; --card:#1c1e23; --ink:#e8e9ec; --muted:#9aa0aa; --line:#2b2e35;
      --accent:#ff6b81; --accent-soft:#33191f; --chip:#282b32; --chip-ink:#dfe1e6;
      --lect:#7fa8e8; --lect-soft:#1b2634;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}

  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  .term{color:var(--muted);font-size:14px}
  .meta{color:var(--muted);font-size:13px;margin:6px 0 18px}
  .meta a{color:var(--accent);text-decoration:none}
  .meta a:hover{text-decoration:underline}
  .warn{color:var(--accent);font-weight:600}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:6px 14px;border-radius:99px;cursor:pointer;font-size:14px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  #q{flex:1;min-width:180px;padding:7px 12px;border:1px solid var(--line);
    border-radius:99px;background:var(--card);color:var(--ink);font-size:14px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;
    overflow:hidden;background:var(--card)}
  .seglabel{color:var(--muted);font-size:13px}
  .segbtn{border:0;background:transparent;color:var(--ink);font-size:13px;
    padding:6px 12px;cursor:pointer}
  .segbtn[aria-selected="true"]{background:var(--accent);color:#fff}
  #jump{margin-left:auto;border:1px solid var(--line);background:var(--card);
    color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px}

  section.week,section.chapter{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;margin-bottom:12px}
  section.week header,section.chapter header{display:flex;align-items:center;gap:10px;
    margin-bottom:8px}
  .wnum,.cnum{font-weight:650;font-size:15px}
  .cnum{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
  .wdate{color:var(--muted);font-size:13px}
  .badge{display:none;margin-left:auto;background:var(--accent);color:#fff;
    font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
  .week.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .week.now .badge{display:inline-block}
  .week.past{opacity:.5}
  section.chapter h3{font-size:15px;margin:0;font-weight:600}
  .notes{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none}
  .notes:hover{color:var(--accent)}

  .day{display:flex;gap:14px;padding:6px 0;border-top:1px solid var(--line)}
  .day:first-of-type{border-top:0}
  .dayname{min-width:66px;color:var(--muted);font-size:13px;padding-top:2px;
    font-variant-numeric:tabular-nums}
  .items{flex:1;display:flex;flex-direction:column;gap:6px}
  .item{font-size:14px}
  .item.lecture{color:var(--ink)}
  .item.lecture b{color:var(--lect)}
  .item.pset b,.item.due b{color:var(--accent)}
  .item.pset,.item.due{color:var(--accent);font-weight:500}
  .item.quiz{color:var(--accent);font-weight:650}
  .item.off,.item.inst,.item.rec,.item.misc{color:var(--muted);font-size:13px}

  .links{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .sub{margin-top:10px;font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em}
  .chip{display:inline-block;background:var(--chip);color:var(--chip-ink);
    border-radius:7px;padding:3px 9px;font-size:12.5px;text-decoration:none;
    border:1px solid transparent}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.ch{background:var(--lect-soft);color:var(--lect)}
  .chip.dead{opacity:.45;cursor:not-allowed}
  /* pset handout chips: always open in Cursor / Preview, so the
     Jupyter-vs-Cursor toggle deliberately does not touch them */
  .chip.work{background:var(--accent);color:#fff;font-weight:600}
  .chip.work:hover{color:#fff;opacity:.9}
  .chip.pdf{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .chip.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .dl-desc .links{margin-top:6px}
  .item.psetout{color:var(--muted);font-size:13px}
  .item.psetout b{color:var(--muted)}
  .note{font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap}

  .dl{display:flex;align-items:baseline;gap:12px;padding:8px 0;
    border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
  .dl:first-of-type{border-top:0}
  .dl-date{min-width:86px;color:var(--muted);font-variant-numeric:tabular-nums;
    font-size:13px}
  .dl-name{font-weight:650;min-width:112px}
  .dl.pset .dl-name,.dl.due .dl-name{color:var(--accent)}
  .dl.quiz .dl-name{color:var(--accent)}
  .dl-desc{flex:1;min-width:140px;color:var(--ink)}
  .dl-when{margin-left:auto;padding-left:10px;font-size:12px;color:var(--muted);
    white-space:nowrap;font-variant-numeric:tabular-nums}
  .dl.past{opacity:.45}
  .dl.next{background:var(--accent-soft);margin:0 -8px;padding-left:8px;
    padding-right:8px;border-radius:8px}
  .dl.next .dl-when{color:var(--accent);font-weight:650}
  .empty{color:var(--muted);font-size:13px}

  /* exercises */
  .ex{display:flex;align-items:baseline;gap:12px;padding:7px 0;
    border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
  .sub + .ex{border-top:0}
  .exn{min-width:38px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  .ext{flex:1;min-width:180px}
  .exa{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-left:auto}
  .exnotes{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
  .exnotes:hover{color:var(--accent)}
  .chip.exjump{background:transparent;border:1px dashed var(--line);color:var(--muted)}
  .chip.exjump:hover{border-color:var(--accent);color:var(--accent)}
  .exch header .note{margin-left:auto}
  .flash{animation:flash 1.2s ease-out}
  @keyframes flash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
  .hide{display:none !important}
  footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Robotic Manipulation</h1>
    <span class="term">6.4210 / 6.4212 &middot; Fall 2026</span>
  </header>
  <div class="meta">
    Jupyter: {{SERVER}} &middot; {{TOTAL}} notebooks &middot;
    psets: <a href="{{HANDOUTS}}" target="_blank">handouts repo ↗</a> &middot;
    <span id="status"></span><span id="nextdue"></span>
  </div>

  <div class="bar">
    <button class="tab" id="tab-weeks" aria-selected="true">By week</button>
    <button class="tab" id="tab-chapters" aria-selected="false">By chapter</button>
    <button class="tab" id="tab-due" aria-selected="false">Due dates</button>
    <button class="tab" id="tab-exm" aria-selected="false">Examples</button>
    <button class="tab" id="tab-ex" aria-selected="false">Exercises</button>
    <input id="q" placeholder="Filter notebooks and topics…" autocomplete="off">
    <span class="seglabel">Open in</span>
    <span class="seg">
      <button class="segbtn" id="oi-j" aria-selected="true">Jupyter</button>
      <button class="segbtn" id="oi-c" aria-selected="false">Cursor</button>
    </span>
    <button id="jump">Jump to this week</button>
  </div>

  <div id="weeks">{{WEEKS}}</div>
  <div id="chapters" class="hide">{{CHAPTERS}}</div>
  <div id="due" class="hide">{{DEADLINES}}</div>
  <div id="exm" class="hide">{{EXAMPLES}}</div>
  <div id="exs" class="hide">{{EXERCISES}}</div>

  <footer>Generated {{GENERATED}} · rebuilt each time you run start.command</footer>
</div>

<script>
(function(){
  // ---- current week: computed live, so the highlight never goes stale ----
  var today = new Date(); today.setHours(0,0,0,0);
  var weeks = [].slice.call(document.querySelectorAll('.week'));
  var current = null;
  weeks.forEach(function(w){
    var s = new Date(w.dataset.start + 'T00:00:00');
    var e = new Date(w.dataset.end + 'T00:00:00');
    if (today > e) w.classList.add('past');
    if (today >= s && today <= e) { w.classList.add('now'); current = w; }
  });
  var status = document.getElementById('status');
  if (current) {
    status.textContent = 'Week ' + (weeks.indexOf(current)+1) + ' of ' + weeks.length;
  } else if (weeks.length && today < new Date(weeks[0].dataset.start+'T00:00:00')) {
    status.textContent = 'Term has not started';
  } else {
    status.textContent = 'Term complete';
  }

  function scrollToCurrent(){
    if (current) current.scrollIntoView({behavior:'smooth', block:'center'});
  }
  document.getElementById('jump').onclick = scrollToCurrent;
  if (current) setTimeout(scrollToCurrent, 120);

  // ---- tabs ----
  var panels = {
    weeks:    [document.getElementById('tab-weeks'),    document.getElementById('weeks')],
    chapters: [document.getElementById('tab-chapters'), document.getElementById('chapters')],
    due:      [document.getElementById('tab-due'),      document.getElementById('due')],
    exm:      [document.getElementById('tab-exm'),      document.getElementById('exm')],
    ex:       [document.getElementById('tab-ex'),       document.getElementById('exs')]
  };
  function show(which){
    Object.keys(panels).forEach(function(k){
      var on = (k === which);
      panels[k][0].setAttribute('aria-selected', on);
      panels[k][1].classList.toggle('hide', !on);
    });
  }
  Object.keys(panels).forEach(function(k){
    panels[k][0].onclick = function(){ show(k); };
  });

  // ---- "Ch. N exercises" chips jump to that chapter in the Exercises tab ----
  [].forEach.call(document.querySelectorAll('a.exjump'), function(a){
    a.onclick = function(e){
      e.preventDefault();
      var panel = a.dataset.panel || 'ex';
      show(panel);
      var sec = document.getElementById(panel + '-' + a.dataset.ch);
      if (sec) {
        // land below the sticky toolbar rather than underneath it
        var bar = document.querySelector('.bar');
        var y = sec.getBoundingClientRect().top + window.scrollY - (bar ? bar.offsetHeight : 0) - 10;
        window.scrollTo({top: y, behavior: 'smooth'});
        sec.classList.remove('flash'); void sec.offsetWidth; sec.classList.add('flash');
      }
    };
  });

  // ---- open-in target: Jupyter tab, or Cursor via the cursor:// scheme ----
  var oij = document.getElementById('oi-j'), oic = document.getElementById('oi-c');
  function applyOpenIn(mode){
    oij.setAttribute('aria-selected', mode === 'jupyter');
    oic.setAttribute('aria-selected', mode === 'cursor');
    [].forEach.call(document.querySelectorAll('a.chip.nb'), function(a){
      var j = a.dataset.j, c = a.dataset.c;
      if (mode === 'cursor') {
        a.href = c; a.removeAttribute('target'); a.classList.remove('dead');
        a.title = 'Open in Cursor';
      } else if (j) {
        a.href = j; a.setAttribute('target', '_blank'); a.classList.remove('dead');
        a.title = 'Open in JupyterLab';
      } else {
        // no Jupyter server was running when this page was built
        a.href = '#'; a.classList.add('dead');
        a.title = 'Jupyter is not running — switch to Cursor, or run start.command';
      }
    });
    try { localStorage.setItem('openIn', mode); } catch (e) {}
  }
  var saved = 'jupyter';
  try { saved = localStorage.getItem('openIn') || 'jupyter'; } catch (e) {}
  applyOpenIn(saved);
  oij.onclick = function(){ applyOpenIn('jupyter'); };
  oic.onclick = function(){ applyOpenIn('cursor'); };

  // ---- due dates: relative timing computed live ----
  var DAY = 86400000, next = null;
  [].forEach.call(document.querySelectorAll('.dl'), function(row){
    var due = new Date(row.dataset.date + 'T00:00:00');
    var days = Math.round((due - today) / DAY);
    var when = row.querySelector('.dl-when');
    if (days < 0)       { row.classList.add('past'); when.textContent = ''; }
    else if (days === 0){ when.textContent = 'today'; }
    else if (days === 1){ when.textContent = 'tomorrow'; }
    else                { when.textContent = 'in ' + days + ' days'; }
    if (days >= 0 && !next) { next = row; row.classList.add('next'); }
  });
  if (next) {
    var nm = next.querySelector('.dl-name').textContent;
    var nw = next.querySelector('.dl-when').textContent;
    var el = document.getElementById('nextdue');
    if (el) { el.textContent = ' · next: ' + nm + ' ' + nw; }
  }

  // ---- filter ----
  var q = document.getElementById('q');
  q.oninput = function(){
    var v = q.value.trim().toLowerCase();
    [].forEach.call(document.querySelectorAll('.exch'), function(sec){
      var any = false;
      [].forEach.call(sec.querySelectorAll('.ex'), function(r){
        var hit = !v || r.textContent.toLowerCase().indexOf(v) !== -1 ||
                  sec.querySelector('h3').textContent.toLowerCase().indexOf(v) !== -1;
        r.classList.toggle('hide', !hit); any = any || hit;
      });
      sec.classList.toggle('hide', !any);
    });
    [].forEach.call(document.querySelectorAll('#weeks .week, #chapters .chapter, #due .dl'), function(sec){
      if (!v) { sec.classList.remove('hide'); return; }
      sec.classList.toggle('hide', sec.textContent.toLowerCase().indexOf(v) === -1);
    });
  };
  q.onkeydown = function(e){ if (e.key === 'Escape') { q.value=''; q.oninput(); } };
})();
</script>
</body>
</html>
